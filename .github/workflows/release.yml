name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo version {version}')
          if f'## [{version}]' not in Path('CHANGELOG.md').read_text(encoding='utf-8'):
              raise SystemExit('Missing changelog section')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: python scripts/package.py --target ${{ matrix.target }}
      - run: python scripts/package_plugin.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: python scripts/package.py --checksums-only
      - name: Verify six packages and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          expected = {
              f'gbk-mcp-{version}-{platform}.zip'
              for platform in ['windows-x86_64', 'linux-x86_64', 'darwin-aarch64']
          } | {
              f'gbk-mcp-{version}-claude-plugin-{platform}.{extension}'
              for platform, extension in [('windows-x86_64', 'zip'), ('linux-x86_64', 'tar.gz'), ('darwin-aarch64', 'tar.gz')]
          }
          actual = {p.name for p in Path('dist').iterdir() if p.name.endswith(('.zip', '.tar.gz'))}
          if actual != expected:
              raise SystemExit(f'Release packages differ: missing={expected - actual}, extra={actual - expected}')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if section is None:
              raise SystemExit('Missing release notes')
          Path('release-notes.md').write_text(section.group(1).strip() + '\n', encoding='utf-8')
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "GBK MCP $RELEASE_TAG" --notes-file release-notes.md
