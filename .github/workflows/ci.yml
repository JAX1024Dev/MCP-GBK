name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/test_package_plugin.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python scripts/smoke_test.py --binary target/debug/gbk-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.308
      - run: cargo build --release --locked
      - run: python scripts/package.py
      - run: python scripts/package_plugin.py
      - run: python scripts/package_plugin.py --format plugin-zip
      - name: Test both packaged plugin formats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          archives = sorted(Path('dist').glob('*-claude-plugin-*'))
          assert len(archives) == 2, archives
          for archive in archives:
              label = 'gui' if '-gui-' in archive.name else 'marketplace'
              subprocess.run([sys.executable, 'scripts/plugin_smoke.py', '--archive', str(archive),
                              '--output', f'benchmark-results/plugin-{label}'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gbk-plugin-check-${{ runner.os }}
          path: benchmark-results/plugin-*/summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gbk-mcp-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
